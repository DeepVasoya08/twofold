name: Backup

# Nightly sealed export of the D1 database (docs/backups.md). The export is sealed to
# BACKUP_PUBLIC_KEY on the runner, so only the offline secret key can open it, and the plain
# export never leaves the runner. The variables and secrets live in the production environment.
on:
  schedule:
    - cron: '30 20 * * *' # 02:00 in India, when the app is quietest
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup-d1
  cancel-in-progress: false

jobs:
  d1:
    name: Back up D1
    runs-on: ubuntu-latest
    # Environment variables and secrets are only visible to a job inside its environment,
    # and never to a job-level `if`.
    environment: production
    timeout-minutes: 15
    env:
      # Its own token: D1 export and writing to the backup bucket, nothing else.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_BACKUP_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
      BACKUP_PUBLIC_KEY: ${{ vars.BACKUP_PUBLIC_KEY }}
      BACKUP_BUCKET: twofold-backups
    steps:
      - name: Check setup
        run: |
          if [ -z "$BACKUP_PUBLIC_KEY" ] || [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::BACKUP_PUBLIC_KEY or CLOUDFLARE_BACKUP_API_TOKEN is not set in the production environment (see docs/backups.md)."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Configure D1 database ID
        working-directory: apps/api
        run: |
          if [ -z "$D1_DATABASE_ID" ]; then
            echo "::error::Variable D1_DATABASE_ID is not set (see docs/deployment.md)."
            exit 1
          fi
          sed -i "s/00000000-0000-0000-0000-000000000000/${D1_DATABASE_ID}/" wrangler.jsonc

      - name: Export, seal and upload
        working-directory: apps/api
        run: |
          set -euo pipefail
          name="d1/$(date -u +%Y-%m-%dT%H%MZ).sealed"
          plain="$RUNNER_TEMP/d1.sql"
          sealed="$RUNNER_TEMP/d1.sealed"
          pnpm exec wrangler d1 export DB --remote --output "$plain"
          pnpm -s backup seal "$plain" "$sealed"
          rm -f "$plain"
          pnpm exec wrangler r2 object put "$BACKUP_BUCKET/$name" --file "$sealed" --remote
          echo "Backed up to $BACKUP_BUCKET/$name ($(stat -c %s "$sealed") bytes)."
