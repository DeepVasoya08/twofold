name: Deploy

# Runs only after the CI workflow succeeds for a push to main.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
      # The public origin for canonical links, link previews and the sitemap (optional).
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Deploy exactly the commit CI tested.
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Configure D1 database ID
        working-directory: apps/api
        run: |
          if [ -z "$D1_DATABASE_ID" ]; then
            echo "::error::Repository variable D1_DATABASE_ID is not set (see docs/deployment.md)."
            exit 1
          fi
          sed -i "s/00000000-0000-0000-0000-000000000000/${D1_DATABASE_ID}/" wrangler.jsonc

      - name: Apply D1 migrations
        working-directory: apps/api
        run: pnpm exec wrangler d1 migrations apply DB --remote

      # Smart search's resources are too big to commit. build.py downloads a pinned export,
      # converts it and checks the result against the hashes the app pins
      # (apps/web/scripts/search-resources/README.md).
      - name: Build Smart search resources
        working-directory: apps/web
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet -r scripts/search-resources/requirements.txt
          .venv/bin/python scripts/search-resources/build.py public/resources/search "$RUNNER_TEMP/search-resources"

      - name: Build web app
        run: pnpm --filter @twofold/web run build
        env:
          # Connect Google Photos' OAuth client (public; unset hides the button).
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}

      # One Worker serves the web app (static assets) and the API (/api/*) on one origin.
      - name: Deploy Worker
        working-directory: apps/api
        run: pnpm exec wrangler deploy

      # Copies photo files into the backup bucket every hour (docs/backups.md).
      - name: Deploy backup Worker
        working-directory: apps/api
        run: pnpm exec wrangler deploy -c wrangler.backup.jsonc
