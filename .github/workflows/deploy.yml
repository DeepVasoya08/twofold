name: Deploy

# Runs only after the CI workflow succeeds for a push to main.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    # The Cloudflare token is given only to the steps that need it (migrations and deploys),
    # never to installs or builds, so a package's install script or build step can't read it.
    env:
      D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
      # The public origin for canonical links, link previews and the sitemap (optional).
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Deploy exactly the commit CI tested.
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Configure D1 database ID
        working-directory: apps/api
        run: |
          if [ -z "$D1_DATABASE_ID" ]; then
            echo "::error::Repository variable D1_DATABASE_ID is not set (see docs/deployment.md)."
            exit 1
          fi
          sed -i "s/00000000-0000-0000-0000-000000000000/${D1_DATABASE_ID}/" wrangler.jsonc

      - name: Apply D1 migrations
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler d1 migrations apply DB --remote

      # Smart search's resources are too big to commit. build.py downloads a pinned export,
      # converts it and checks the result against the hashes the app pins
      # (apps/web/scripts/search-resources/README.md).
      - name: Build Smart search resources
        working-directory: apps/web
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet -r scripts/search-resources/requirements.txt
          .venv/bin/python scripts/search-resources/build.py public/resources/search "$RUNNER_TEMP/search-resources"

      - name: Build web app
        run: pnpm --filter @arcafold/web run build
        env:
          # Connect Google Photos' OAuth client (public; unset hides the button).
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}

      # Each deploy replaces every file the Worker serves, so a tab opened before it would ask
      # for scripts that are gone (Smart search, uploads and unlocking load theirs on first
      # use). Copy the files recent builds still need from the live site into this one, for
      # a week (src/build/asset-history.ts, docs/deployment.md).
      - name: Keep recent builds' files
        working-directory: apps/web
        run: |
          origin="${SITE_URL:-https://arcafold.deepvasoya08.workers.dev}"
          node scripts/keep-old-assets.mjs "${origin%/}"

      # One Worker serves the web app (static assets) and the API (/api/*) on one origin.
      - name: Deploy Worker
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy

      # Account email needs a secret that keys the stored email codes (docs/email.md). It is
      # copied from the production environment's EMAIL_CODE_SECRET; until that exists, email
      # stays off and nobody is asked to confirm theirs. Only this step sees the secret.
      - name: Set email code secret
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EMAIL_CODE_SECRET: ${{ secrets.EMAIL_CODE_SECRET }}
        run: |
          if [ -z "$EMAIL_CODE_SECRET" ]; then
            echo "EMAIL_CODE_SECRET is not set; account email stays off."
            exit 0
          fi
          printf '%s' "$EMAIL_CODE_SECRET" | pnpm exec wrangler secret put EMAIL_CODE_SECRET

      # Copies photo files into the backup bucket every hour (docs/backups.md).
      - name: Deploy backup Worker
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy -c wrangler.backup.jsonc
